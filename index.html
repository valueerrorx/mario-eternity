  <html>
<head>
<title>Phaser Einführung</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel=stylesheet href=index.css>
<script src="phaser.min.js"></script>
</head>
<body>
<a href="http://phaser.io" target=blank><span class=header> Phaser HTML5 Framework - Version 4 </span></a>
<div id=preview name=preview ></div>
<div id=stuff>
<div class=main><a href="http://labs.phaser.io/index.html" target=blank> Phaser4<br>Examples </a></div>
<div class="main"><a href="#" onclick="location.reload();" > reload <br><br></a></div>
</div>

<script type="text/javascript">

// the phaser.game config object
let config = {
    type: Phaser.AUTO,  // Which renderer to use
    width: 800,         // Canvas width in pixels
    height: 480,        // Canvas height in pixels
    parent:"preview",   // ID of the DOM element to add the canvas to
    physics: {
        default: 'arcade',       // Which physics engine to use
        arcade: {
            gravity: { y: 1800 },
            debug: true              // paint debug information (hitboxes)
        }
    },
    scene: {        // scene object (also eats array of scenes aka game.states)
        preload: preload,
        create: create,
        update: update
    },
    map: null,
    player: null,
    coins: 0,
    coinText: null,
    lives: 1,
    maxLives: 2,
    hearts: [],
    playerSpawn: { x: 330, y: 200 },
};


let jumpCount = 0;




let game = new Phaser.Game(config);  //our game instance - using the config object

let player;
let cursors;
let wasd;
let shootKey;
let timerText;
let timerSeconds = 300;
let timerActive = true;
let timerBlinkTime = 0;
let timerBlinkState = false;

//runs once - preloads images, soundfiles, maps
function preload () {   
    this.load.image('clouds','assets/clouds.jpg')
    // this.load.image('mario','assets/mario.png')
    this.load.image('green','assets/green.png')
    this.load.image('darkgreen','assets/darkgreen.png')
    this.load.image('enemy', 'assets/green.png')
    this.load.image('bullet', 'assets/green.png')

    
    this.load.spritesheet('mario', 'assets/mariospritesheet-big.png', { frameWidth: 50, frameHeight: 67 } )



    this.load.tilemapTiledJSON('1', 'assets/level_01.json') 
    this.load.image('tileset', 'assets/tileset.png')

}


// runs once after preload - create world here
function create () { 

    createmap('1', this)




    // Mario mit Physik aktivieren
    player = this.physics.add.sprite(config.playerSpawn.x, config.playerSpawn.y, 'mario');
    player.setCircle(28, -2, 8)
    player.setCollideWorldBounds(false);
    this.physics.world.setBoundsCollision(true, true, true, false);
    player.speed = 400
    player.setDepth(50)
    player.invulnerable = false;

    config.heartPickup = this.add.text(220, 350, '❤', {
        fontSize: '28px',
        color: '#ff4d6d',
        fontStyle: 'bold'
    });
    config.heartPickup.setDepth(80);
    this.physics.add.existing(config.heartPickup);
    config.heartPickup.body.setAllowGravity(false);
    config.heartPickup.body.setImmovable(true);
    this.physics.add.overlap(player, config.heartPickup, collectHeart, null, this);

    this.cameras.main.startFollow(player)

    this.anims.create({
        key: 'walk',
        frameRate: 16,
        frames: this.anims.generateFrameNumbers( 'mario', { frames: [2,3,4,3,2,1,0,1 ] })
    })

    wasd = this.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.SPACE,
        left: Phaser.Input.Keyboard.KeyCodes.A,
        down: Phaser.Input.Keyboard.KeyCodes.S,
        right: Phaser.Input.Keyboard.KeyCodes.D
    });

    shootKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.E);

    this.physics.add.collider(player, config.floorlayer)
    this.physics.add.overlap(player, config.assetlayer, collect, assetTileOverlap, this)

    config.enemies = this.physics.add.group({
        classType: Phaser.Physics.Arcade.Sprite,
        runChildUpdate: true
    });
    config.bullets = this.physics.add.group();

    spawnEnemies(this);

    const bonusEnemy = this.add.rectangle(600, 420, 28, 28, 0xff4d4d);
    this.physics.add.existing(bonusEnemy);
    config.enemies.add(bonusEnemy);
    bonusEnemy.body.setAllowGravity(false);
    bonusEnemy.body.setImmovable(true);
    bonusEnemy.body.setVelocityX(-80);
    bonusEnemy.setDepth(60);
    this.physics.add.collider(bonusEnemy, config.floorlayer);
    this.physics.add.collider(player, config.enemies, handlePlayerHit, null, this)
    this.physics.add.collider(config.enemies, config.floorlayer)
    this.physics.add.overlap(config.bullets, config.enemies, bulletHitEnemy, null, this)

    createLifeHud.call(this)
   
    // Timer erstellen
    timerText = this.add.text(16, 16, formatTimer(timerSeconds), { fontSize: '32px', fill: 'red', fontStyle: 1000 });
    timerText.setScrollFactor(0)
    timerText.setDepth(100)
    timerActive = true;
    timerBlinkTime = 0;
    timerBlinkState = false;

    config.gameOverText = this.add.text(config.width / 2, config.height / 2, 'GAME OVER', {
        fontSize: '52px',
        color: '#ffffff',
        fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(200);
    config.gameOverText.setVisible(false);
}

function formatTimer(seconds) {
    let time = Math.max(seconds, 0)
    let wholeSeconds = Math.floor(time)
    let ms = Math.floor((time - wholeSeconds) * 1000)
    return `${wholeSeconds}s ${ms.toString().padStart(3, '0')}ms`
}








// runs 60times per second - everything that needs updates goes here..
function update (time, delta){ 
    if (config.lives <= 0) {
        if (config.gameOverText) {
            config.gameOverText.setVisible(true);
        }
        if (player) {
            player.setVelocity(0, 0);
        }
        return;
    }

    if (timerActive) {
        timerSeconds -= delta / 1000
        if (timerSeconds <= 0) {
            timerSeconds = 0
            timerActive = false
            timerBlinkTime = 0
            timerBlinkState = false
            timerText.setFill('#FFFF00')
        }
    } else {
        timerBlinkTime += delta
        if (timerBlinkTime >= 500) {
            timerBlinkTime -= 500
            timerBlinkState = !timerBlinkState
            timerText.setVisible(timerBlinkState)
        }
    }
    timerText.setText(formatTimer(timerSeconds))
    
    let sx = this.cameras.main.scrollX
    config.clouds.x = sx
    config.green.x = sx * 0.4
    config.darkgreen.x = sx * 0.2

    // Bewegung nach links
    if (wasd.left.isDown) {
        player.setVelocityX(-player.speed);
        player.setFlipX(false);
        player.facing = 'left';
        player.anims.play('walk', true)


    } else if (wasd.right.isDown) {
        player.setVelocityX(player.speed);
        player.setFlipX(true);
        player.facing = 'right';
        player.anims.play('walk', true)


    } else {
    player.setVelocityX(0);
    player.setFrame(2)
    }

    // Double-Jump: Reset am Boden und ein zusätzlicher Sprung in der Luft
    if (player.body.blocked.down) {
        jumpCount = 0;
    }

    if (Phaser.Input.Keyboard.JustDown(wasd.up) && jumpCount < 2) {
        player.setVelocityY(-700);
        jumpCount++;
    }

  
    if (shootKey.isDown && this.time.now > config.lastShot) {
        shootBullet(this);
        config.lastShot = this.time.now + config.shotCooldown;
    }

    if (!player.body.blocked.down){
    player.setFrame(5)
    }

    if (player.y > config.map.heightInPixels + 80 && !player.invulnerable) {
        loseLife.call(this, 'fall');
    }

}


function createmap(mapID, scene){
    config.map = scene.make.tilemap( { key: mapID}   )

    let tiles = config.map.addTilesetImage('tileset','tileset')


    // Hintergrundbild über ganze Spielfläche
    config.clouds=scene.add.tileSprite(0, 0,  config.map.widthInPixels, config.map.heightInPixels, 'clouds').setOrigin(0,0)
    config.green=scene.add.tileSprite(0, config.map.heightInPixels-640,  config.map.widthInPixels, config.map.heightInPixels, 'green').setOrigin(0,0)
    config.darkgreen=scene.add.tileSprite(0, config.map.heightInPixels-480,  config.map.widthInPixels, config.map.heightInPixels, 'darkgreen').setOrigin(0,0)

    config.floorlayer = config.map.createLayer('floor', tiles, 0, 0).setCollisionBetween(1, 10000) 
    config.enemylayer =  config.map.createLayer('enemylayer', tiles, 0, 0).setCollisionBetween(1, 10000)
    config.assetlayer =  config.map.createLayer('assetlayer', tiles, 0, 0).setCollisionBetween(1, 10000)


    config.backgroundlayer =  config.map.createLayer('background', tiles, 0, 0).setDepth(40)
    config.foregroundlayer =  config.map.createLayer('foreground', tiles, 0, 0).setDepth(60)

 
    scene.physics.world.setBounds(0,0, config.map.widthInPixels, config.map.heightInPixels)
    scene.cameras.main.setBounds(0, 0, config.map.widthInPixels, config.map.heightInPixels)





}



function assetTileoverlap(player,tile){

    return tile.index > 0

}


function collect(player,tile){

    console.log("coin");
    config.interact.removeTileAt(tile.x,tile.y)

}


function death(player,tile){

    console.log("death")

}


  
function assetTileOverlap(player, tile) {
    return tile.index > 0
}

function collect(player, tile) {
    if (!tile) return;

    if (isHazardTile(tile.index)) {
        loseLife.call(this, 'spikes');
        return;
    }

    config.assetlayer.removeTileAt(tile.x, tile.y)
    config.coins += 1
    if (config.coinText) {
        config.coinText.setText('Coins: ' + config.coins)
    }
}

function isHazardTile(tileIndex) {
    return (tileIndex >= 77 && tileIndex <= 140) || (tileIndex >= 155 && tileIndex <= 206);
}

function respawnPlayer() {
    if (!player || !config.map) {
        return;
    }

    const safeX = Phaser.Math.Clamp(config.playerSpawn.x, 40, config.map.widthInPixels - 40);
    const safeY = Phaser.Math.Clamp(config.playerSpawn.y, 80, config.map.heightInPixels - 80);
    player.setPosition(safeX, safeY);
    player.setVelocity(0, 0);
}

function loseLife(reason) {
    if (!player || player.invulnerable) {
        return;
    }

    config.lives = Math.max(0, config.lives - 1);
    updateLifeHud();

    player.invulnerable = true;
    player.setTint(0xffb3b3);
    player.setVelocityY(-320);
    player.setVelocityX(player.x < config.playerSpawn.x ? -220 : 220);
    respawnPlayer();

    if (config.lives <= 0) {
        player.disableBody(true, true);
        if (config.gameOverText) {
            config.gameOverText.setVisible(true);
        }
        return;
    }

    this.time.delayedCall(1000, () => {
        player.clearTint();
        player.invulnerable = false;
    }, [], this);
}

function createLifeHud() {
    config.hearts = [];
    const startX = config.width - 26;

    for (let i = 0; i < config.maxLives; i++) {
        const heart = this.add.text(startX - i * 28, 18, '❤', {
            fontSize: '28px',
            color: '#ff4d6d',
            fontStyle: 'bold'
        }).setScrollFactor(0);
        heart.setDepth(100);
        config.hearts.push(heart);
    }

    updateLifeHud();
}

function updateLifeHud() {
    config.hearts.forEach((heart, index) => {
        heart.setVisible(index < config.lives);
    });
}

function collectHeart(playerSprite, heartPickup) {
    if (!playerSprite || !heartPickup || config.lives >= config.maxLives) {
        return;
    }

    config.lives = Math.min(config.maxLives, config.lives + 1);
    updateLifeHud();
    heartPickup.disableBody(true, true);
    heartPickup.setVisible(false);
}

function handlePlayerHit(playerSprite, enemy) {
    if (!playerSprite || !enemy || playerSprite.invulnerable) {
        return;
    }

    config.lives = Math.max(0, config.lives - 1);
    updateLifeHud();
    playerSprite.invulnerable = true;
    playerSprite.setTint(0xffb3b3);
    playerSprite.setVelocityY(-320);
    playerSprite.setVelocityX(playerSprite.x < enemy.x ? -220 : 220);
    playerSprite.setPosition(config.playerSpawn.x, config.playerSpawn.y);

    if (config.lives <= 0) {
        playerSprite.disableBody(true, true);
        if (config.gameOverText) {
            config.gameOverText.setVisible(true);
        }
        return;
    }

    this.time.delayedCall(1000, () => {
        playerSprite.clearTint();
        playerSprite.invulnerable = false;
    }, [], this);
}

function spawnEnemies(scene) {
    (config.enemySpawns || []).forEach(spawn => {
        let enemy = config.enemies.create(spawn.x, spawn.y, 'enemy');
        if (!enemy) {
            return;
        }
        enemy.setActive(true);
        enemy.setVisible(true);
        enemy.body.setAllowGravity(true);
        enemy.setCollideWorldBounds(true);
        enemy.setBounce(1, 0);
        enemy.speed = 80;
        enemy.setVelocityX(-enemy.speed);
    });
}

function shootBullet(scene) {
    let offsetX = player.facing === 'left' ? -30 : 30;
    let bullet = config.bullets.get(player.x + offsetX, player.y - 10, 'bullet');
    if (!bullet) {
        return;
    }

    bullet.enableBody(true, player.x + offsetX, player.y - 10, true, true);
    bullet.body.setAllowGravity(false);
    bullet.body.setVelocityX(player.facing === 'left' ? -900 : 900);
    bullet.body.setVelocityY(0);
    bullet.body.setCollideWorldBounds(true);
    bullet.body.onWorldBounds = true;
    bullet.setDepth(60);
    bullet.setActive(true);
    bullet.setVisible(true);
}

function bulletHitEnemy(bullet, enemy) {
    if (!bullet || !enemy) {
        return;
    }
    bullet.disableBody(true, true);
    enemy.disableBody(true, true);
    console.log("enemy hit!");
}






</script>
</body>
