<html>
<head>
<title>Phaser Einführung</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<link rel=stylesheet href=index.css>
<script src="phaser.min.js"></script>
</head>
<body>
<a href="http://phaser.io" target=blank><span class=header> Phaser HTML5 Framework - Version 4 </span></a>
<div id=preview name=preview ></div>
<div id=stuff>
<div class=main><a href="http://labs.phaser.io/index.html" target=blank> Phaser4<br>Examples </a></div>
<div class="main"><a href="#" onclick="location.reload();" > reload <br><br></a></div>
</div>

<script type="text/javascript">

let config = {
type: Phaser.AUTO, 
width: 800, 
height: 480, 
parent:"preview", 
physics: {
default: 'arcade', 
arcade: {
gravity: { y: 1200 },
debug: true 
}
},
scene: { 
preload: preload,
create: create,
update: update
},
map: null,
player: null,
};


let game = new Phaser.Game(config); 

let player;
let cursors;
let wasd;


function preload () {
this.load.image('clouds','assets/clouds.jpg')


this.load.spritesheet('mario', 'assets/mariospritesheet-big.png', { frameWidth: 50, frameHeight: 67 } )

this.load.tilemapTiledJSON('map1', 'assets/map.json') 
this.load.image('tileset', 'assets/tileset.png')


}



function create () {

    player = this.physics.add.sprite(330, 30, 'mario');
    player.setCircle(28, -2, 8)
    player.setCollideWorldBounds(true);
    player.setDepth(50)

    this.cameras.main.startFollow(player) 

    this.anims.create({
        key: 'walk',
        frameRate: 16,
        frames: this.anims.generateFrameNumbers( 'mario', { frames: [2,3,4,3,2,1,0,1 ] })
    })


    createmap('map1',this)

    
    wasd = this.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.SPACE,
        left: Phaser.Input.Keyboard.KeyCodes.A,
        down: Phaser.Input.Keyboard.KeyCodes.S,
        right: Phaser.Input.Keyboard.KeyCodes.D
    });


    this.physics.add.collider(player,config.floor);
    this.physics.add.collider(player,config.interact, collect, assetTileOverlap, this);
    this.physics.add.overlap(player,config.enemies, death, null, this);


}


function update (){

    const speed = 220;


    if (wasd.left.isDown) {
    player.setVelocityX(-speed);
    player.setFlipX(false);
    player.anims.play('walk', true)


    } else if (wasd.right.isDown) {
    player.setVelocityX(speed);
    player.setFlipX(true);
    player.anims.play('walk', true)


    } else {
    player.setVelocityX(0);
    player.setFrame(2)
    }

    if (wasd.up.isDown && player.body.blocked.down) {
    player.setVelocityY(-520);
    }

    if (!player.body.blocked.down){
    player.setFrame(5)
    }








}

function createmap(mapID, scene){



    config.map = scene.make.tilemap( { key: mapID} )


    let tiles = config.map.addTilesetImage('tileset', 'tileset')


    scene.add.tileSprite(0, 0, config.map.widthInPixels, config.map.heightInPixels, 'clouds').setOrigin(0,0).setDepth(0)


    config.floor = config.map.createLayer('floor', tiles, 0,0).setCollisionbetween(1,16000);
    config.enemies = config.map.createLayer('enemies', tiles, 0, 0).setCollisionBetween(1, 16000);
    config.interact = config.map.createLayer('interact', tiles, 0, 0).setCollisionBetween(1, 16000);

    config.foreground = config.map.createLayer('foreground', tiles, 0, 0).setDepth(1, 51);
    config.background = config.map.createLayer('background', tiles, 0, 0).setDepth(1, 1);



    scene.physics.world.setBounds(0, 0, config.map.widthInPixels, config.map.heightInPixels) 
    scene.cameras.main.setBounds(0, 0, config.map.widthInPixels, config.map.heightInPixels);


}


function assetTileoverlap(player,tile){

    return tile.index > 0

}


function collect(player,tile){

    console.log("coin");
    config.interact.removeTileAt(tile.x,tile.y)

}


function death(player,tile){

    console.log("death")

}







</script>
</body>
</html>
